name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # The docs live on Read the Docs; GitHub Pages only serves redirects from the old URLs.
      - 'docs/index.html'
      - 'docs/tutorial.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage the redirect pages
        run: mkdir _site && cp docs/index.html docs/tutorial.html _site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
