name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Same version as the pre-commit hook (.pre-commit-config.yaml rev); bump both together.
        # Pinned because new ruff releases change what is checked (0.17 added Markdown code blocks).
        run: pip install ruff==0.17.0

      - name: Check linting
        run: ruff check src/ tests/ docs/

      - name: Check formatting
        run: ruff format --check src/ tests/ docs/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Cache Q-matrices
        id: cache-q
        uses: actions/cache@v4
        with:
          path: ~/.cache/rctd
          key: q-matrices-v0.1.1

      - name: Download Q-matrices
        if: steps.cache-q.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cache/rctd
          gh release download v0.1.1 --repo p-gueguen/rctd-py \
            --pattern q_matrices.npz --dir ~/.cache/rctd

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v -m "not slow"

      - name: Run slow integration + R concordance tests
        run: pytest tests/ -v -m slow

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the tags for the version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (CPU-only torch)
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system ".[doc]"

      - name: Build docs (warnings are errors)
        run: sphinx-build -W --keep-going -n -b html docs docs/_build/html

